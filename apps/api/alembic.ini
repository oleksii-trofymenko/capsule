# Alembic (ADR-007). Run from apps/api: `alembic upgrade head`. How to add a migration: CLAUDE.md.
# The database URL is never written here: migrations/env.py reads DATABASE_URL through
# core/config.py. No logging sections on purpose: Alembic's fileConfig would reconfigure logging.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
# Date first, so files sort in creation order; the revision id still defines the order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
