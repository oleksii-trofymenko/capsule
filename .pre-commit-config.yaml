# Pre-commit hooks (ADR-018). Install once: `make hooks`. Run all: `make lint`.
# Every rev is pinned; bump with `pre-commit autoupdate` in its own PR.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
minimum_pre_commit_version: "4.0.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        files: ^apps/api/
        args: [] # strictness comes from [tool.mypy] in pyproject.toml

  # Mobile tools run from apps/mobile/node_modules, so versions live in its package.json.
  # They skip while apps/mobile has no source files; root-level config files do not trigger them.
  - repo: local
    hooks:
      - id: prettier
        name: prettier (apps/mobile)
        language: system
        entry: bash -c 'cd apps/mobile && npx --no-install prettier --write --log-level warn .'
        files: ^apps/mobile/.*\.(ts|tsx|js|jsx|json)$
        exclude: ^apps/mobile/[^/]+$
        pass_filenames: false
      - id: eslint
        name: eslint (apps/mobile)
        language: system
        entry: bash -c 'cd apps/mobile && npx --no-install eslint --max-warnings=0 .'
        files: ^apps/mobile/.*\.(ts|tsx|js|jsx)$
        exclude: ^apps/mobile/[^/]+$
        pass_filenames: false
      - id: tsc
        name: tsc --noEmit (apps/mobile)
        language: system
        entry: bash -c 'cd apps/mobile && npx --no-install tsc --noEmit'
        files: ^apps/mobile/.*\.(ts|tsx)$
        pass_filenames: false

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--force-scope]
