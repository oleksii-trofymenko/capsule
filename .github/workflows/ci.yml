# CI (ADR-019, tests per ADR-016). The only required check is `ci-ok`.
# Area jobs are skipped when their files did not change; `ci-ok` always runs and passes only
# when every job succeeded or was skipped, so a skipped job never leaves the PR "waiting".
# Actions are pinned to commit SHAs. Bumps follow ADR-018: own PR, release >= 7 days old,
# release notes linked, security-engineer review.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited] # `edited`: re-check a renamed PR title
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *" # daily full run on main: new advisories surface without a code change

permissions:
  contents: read

# PRs: a new push cancels the older run. main and schedule: one group per commit, never cancelled.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  UV_VERSION: "0.13.1"
  PRE_COMMIT_VERSION: "4.7.0"
  PIP_AUDIT_VERSION: "2.10.1"
  NODE_VERSION: "24.22.0"
  # Resolution cutoff for CI tools that uv installs (pre-commit, pip-audit and their transitive
  # dependencies). Applied per step, never workflow-wide: a global value makes `--locked` reject
  # the project's uv.lock. Bump together with the tool versions; at least 7 days old (ADR-019).
  TOOLS_EXCLUDE_NEWER: "2026-10-19T00:00:00Z"

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      api: ${{ steps.diff.outputs.api }}
      mobile: ${{ steps.diff.outputs.mobile }}
      stack: ${{ steps.diff.outputs.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the PR merge commit and its base parent
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # Shared files (workflows, Makefile, hook config, contract) count for every area.
          shared='^(\.github/workflows/|Makefile$|\.pre-commit-config\.yaml$|contracts/)'
          if [ "$EVENT" != "pull_request" ]; then
            echo "$EVENT: full run."
            { echo "api=true"; echo "mobile=true"; echo "stack=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only HEAD^1 HEAD)
          # File names come from the PR: stop workflow-command parsing while printing them.
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          printf 'Changed files:\n%s\n' "$files"
          echo "::$token::"
          match() { grep -qE "$1|$shared" <<< "$files" && echo true || echo false; }
          echo "api=$(match '^(apps/api/|pyproject\.toml$|\.python-version$)')" >> "$GITHUB_OUTPUT"
          echo "mobile=$(match '^apps/mobile/')" >> "$GITHUB_OUTPUT"
          echo "stack=$(match '^(apps/api/|infra/compose/|\.env\.example$)')" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      # The squash commit on main takes the PR title, which local commit-msg hooks never see.
      # Intentionally stricter than the local conventional-pre-commit --force-scope hook
      # (ADR-018): fixed type list, lowercase kebab-case scope, no leading space after the colon.
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)\([a-z0-9-]+\)!?: [^ ].*$'
          if [[ "$TITLE" =~ $re ]]; then
            echo "PR title OK: $TITLE"
          else
            echo "::error::PR title must be a Conventional Commit with a scope, e.g. 'ci(repo): add CI workflow'. Got: $TITLE"
            exit 1
          fi

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install pre-commit
        env:
          UV_EXCLUDE_NEWER: ${{ env.TOOLS_EXCLUDE_NEWER }}
        run: |
          uv tool install "pre-commit==$PRE_COMMIT_VERSION" --python 3.13
          uv tool dir --bin >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-secrets-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # Same pinned gitleaks as the local hook; scans every commit reachable from HEAD.
      # --verbose prints gitleaks' summary (commits scanned); findings are shown with --redact.
      - run: pre-commit run gitleaks-history --all-files --hook-stage manual --verbose

  lint:
    name: lint (all hooks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install pre-commit
        env:
          UV_EXCLUDE_NEWER: ${{ env.TOOLS_EXCLUDE_NEWER }}
        run: |
          uv tool install "pre-commit==$PRE_COMMIT_VERSION" --python 3.13
          uv tool dir --bin >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-lint-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # Mobile hooks (Prettier, ESLint, tsc) run from apps/mobile/node_modules.
      # Keyed on package.json, so a missing lockfile fails setup-node / `npm ci` loudly.
      - if: hashFiles('apps/mobile/package.json') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - if: hashFiles('apps/mobile/package.json') != ''
        run: npm ci --prefix apps/mobile
      # Lint + typecheck (Ruff, mypy, Prettier, ESLint, tsc). Secrets run in their own job.
      - run: make lint
        env:
          SKIP: gitleaks
      # Compose pins must equal the service images below and UV_VERSION (ADR-016); the Compose
      # files must parse. test.env holds test-only values, so no secrets are needed.
      - name: Compose pins and config
        run: |
          bash infra/compose/check-pins.sh
          docker compose --env-file infra/compose/test.env -f infra/compose/compose.base.yml \
            -f infra/compose/compose.test.yml config --quiet

  unit-api:
    name: unit (api)
    needs: [changes, lint]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: project
        run: |
          if [ -f apps/api/pyproject.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::No apps/api project yet (E0-06); nothing to test."; fi
      - if: steps.project.outputs.present == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      # --locked fails without uv.lock; zero collected tests (exit 5) fails too.
      - if: steps.project.outputs.present == 'true'
        run: uv run --directory apps/api --locked pytest -m "not integration"

  unit-mobile:
    name: unit (mobile)
    needs: [changes, lint]
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: project
        run: |
          if [ -f apps/mobile/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::No apps/mobile package yet; nothing to test."; fi
      - if: steps.project.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      # `npm ci` fails without package-lock.json.
      - if: steps.project.outputs.present == 'true'
        run: |
          npm ci --prefix apps/mobile
          npm --prefix apps/mobile test -- --ci

  integration:
    name: integration (api)
    needs: [changes, lint]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      # Throwaway CI-only credentials; the containers exist for this job only.
      postgres:
        image: pgvector/pgvector:0.8.7-pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: capsule
          POSTGRES_PASSWORD: capsule
          POSTGRES_DB: capsule_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U capsule -d capsule_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
      redis:
        image: redis:8.10.2-alpine@sha256:9f8d2d789b9a1d1e3f283f979aa9cbf393373806472e1ccd460e2f9c869b833b
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgresql://capsule:capsule@localhost:5432/capsule_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check service wiring (pgvector, Redis, host ports)
        env:
          PG: ${{ job.services.postgres.id }}
          REDIS: ${{ job.services.redis.id }}
        run: |
          docker exec "$PG" psql -U capsule -d capsule_test -v ON_ERROR_STOP=1 -tAc \
            "CREATE EXTENSION IF NOT EXISTS vector; SELECT 'pgvector ' || extversion FROM pg_extension WHERE extname = 'vector';"
          test "$(docker exec "$REDIS" redis-cli ping)" = "PONG" && echo "redis PONG"
          timeout 5 bash -c '</dev/tcp/127.0.0.1/5432' && echo "localhost:5432 open"
          timeout 5 bash -c '</dev/tcp/127.0.0.1/6379' && echo "localhost:6379 open"
      - id: project
        run: |
          if [ -f apps/api/pyproject.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::No apps/api project yet (E0-06); services checked, no tests to run."; fi
      - if: steps.project.outputs.present == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      # --locked fails without uv.lock; zero collected tests (exit 5) fails too.
      - if: steps.project.outputs.present == 'true'
        run: uv run --directory apps/api --locked pytest -m integration

  audit-api:
    name: audit (api)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: project
        run: |
          if [ -f apps/api/pyproject.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::No apps/api project yet (E0-06); nothing to audit."; fi
      - if: steps.project.outputs.present == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      # `uv export --locked` fails without uv.lock and runs without the cutoff.
      # pip-audit fails on ANY known vulnerability (no severity filter; ADR-019).
      # Exceptions: add `--ignore-vuln <ID>` here with a comment giving the reason and a review date.
      - if: steps.project.outputs.present == 'true'
        env:
          TOOLS_CUTOFF: ${{ env.TOOLS_EXCLUDE_NEWER }}
        run: |
          uv export --directory apps/api --locked --no-emit-project --format requirements-txt \
            --output-file "$RUNNER_TEMP/requirements.txt"
          # PYSEC-2026-4320: false positive for certifi 2026.10.18 (that release removed all emSign roots; OSV range wrongly includes it). Dev-only via httpx. Remove at the next exclude-newer bump (>= 2026-10-27, picks up 2026.10.19). Review by 2026-11-09. Approved: security-engineer.
          UV_EXCLUDE_NEWER="$TOOLS_CUTOFF" uvx --python 3.13 "pip-audit==$PIP_AUDIT_VERSION" \
            --strict --disable-pip --requirement "$RUNNER_TEMP/requirements.txt" \
            --ignore-vuln PYSEC-2026-4320

  audit-mobile:
    name: audit (mobile)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: project
        run: |
          if [ -f apps/mobile/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::No apps/mobile package yet; nothing to audit."; fi
      - if: steps.project.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # High and critical advisories fail the build. Reads the lockfile only (no install);
      # fails with ENOLOCK when package-lock.json is missing.
      - if: steps.project.outputs.present == 'true'
        run: npm audit --prefix apps/mobile --audit-level=high

  # E0-13: build the api image and run the real Compose stack (`make up`) with throwaway secrets,
  # then the SeaweedFS lockdown check and a restart that must keep Postgres, Redis and SeaweedFS
  # data (E0-14: the S3 object must be readable right after `make up`). E1-05b (ADR-015): the JWT
  # key file gets the production layout, api must read it, and no generated value may reach the logs.
  # Triage: docs/runbooks/compose-stack.md, "CI job `stack` fails".
  stack:
    name: stack (compose smoke)
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Same project and files as the Makefile; check-seaweedfs.sh expects the `capsule` project.
      COMPOSE: docker compose --project-name capsule --env-file .env -f infra/compose/compose.base.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # env-init writes random values for every `change-me` in .env.example and the files in
      # secrets/ (ADR-015), and prints no value. `generate-only` skips the file layout, so every
      # value can be masked here, before any later step can print it; `make up` reuses them.
      # Every value also goes to a mode-600 pattern file for the leaked-value log check, and that
      # check is written once to $RUNNER_TEMP/leak-check.sh for the two places that run it.
      - name: Throwaway secrets (generated and masked)
        run: |
          bash infra/compose/env-init.sh . generate-only
          patterns="$RUNNER_TEMP/leak-patterns"
          install -m 600 /dev/null "$patterns"
          for key in $(sed -nE 's/^([A-Z0-9_]+)=change-me$/\1/p' .env.example); do
            value=$(sed -nE "s/^${key}=(.*)$/\1/p" .env)
            [ -n "$value" ] || { echo "::error::$key missing from .env"; exit 1; }
            echo "::add-mask::$value"
            printf '%s\n' "$value" >> "$patterns"
          done
          shopt -s nullglob
          files=(secrets/*)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::no files in secrets/ after env-init"; exit 1; }
          for f in "${files[@]}"; do
            case ${f#secrets/} in
              jwt_signing_keys) ;; # `kid=hexkey` lines: each hex value masked on its own
              *) echo "::error::no masking rule for $f; add one here (ADR-015)"; exit 1 ;;
            esac
            n=0
            while IFS= read -r line; do
              value=${line#*=}
              [[ $value =~ ^[0-9a-f]{64}$ ]] || { echo "::error::$f line $((n + 1)) is not kid=<64 hex>"; exit 1; }
              echo "::add-mask::$value"
              printf '%s\n' "$value" >> "$patterns"
              n=$((n + 1))
            done < "$f"
            [ "$n" -gt 0 ] || { echo "::error::$f has no key lines"; exit 1; }
            echo "$f: $n value(s) masked"
          done
          echo "leak patterns: $(wc -l < "$patterns") value(s) (.env and secrets/)"
          cat > "$RUNNER_TEMP/leak-check.sh" <<'EOF'
          # Fails if any generated value appears in the stack logs (ADR-015).
          set -euo pipefail
          p="$RUNNER_TEMP/leak-patterns"
          [ -s "$p" ] || { echo "::error::leak patterns file is missing or empty"; exit 1; }
          # ADR-024: the one exception. SeaweedFS logs the S3 access key ID (an identifier, not a
          # secret) in its startup line; only that line, only from the seaweedfs service, is dropped.
          # The ID anywhere else still fails. A changed message is not dropped, so CI fails closed.
          # SeaweedFS 4.48 writes `auth_credentials.go:582 Added ...` (no `]`); `\]?` also takes glog's.
          adr024='^seaweedfs-[0-9]+ +\| .*auth_credentials\.go:[0-9]+\]? Added admin identity from AWS environment variables: '
          # scan: reads logs on stdin; exit 0 = a generated value found, 1 = none, 2+ = error.
          scan() {
            local kept rc=0
            kept=$(grep -vE "$adr024") || rc=$?
            [ "$rc" -le 1 ] || return 2
            grep -qFf "$p" <<< "$kept"
          }
          # Control: a non-seaweedfs line carrying the ADR-024 message and the first pattern must hit.
          scan <<< "api-1  | auth_credentials.go:1 Added admin identity from AWS environment variables: $(head -n1 "$p")" ||
            { echo "::error::leak grep self-test did not match"; exit 1; }
          # A variable, not a pipe: with pipefail, `grep -q` closing the pipe early hides a hit.
          logs=$($COMPOSE logs --no-color)
          rc=0
          scan <<< "$logs" || rc=$?
          case $rc in
            0) echo "::error::a generated secret appears in the stack logs; see docs/runbooks/secret-leak.md"; exit 1 ;;
            1) echo "none of the $(wc -l < "$p") generated value(s) appear in the logs" ;;
            *) echo "::error::leak grep failed (exit $rc)"; exit 1 ;;
          esac
          EOF
      # Same layout as production (ADR-015): secrets/ 0700, key file root:10001 0440 via sudo.
      # From here on the runner (uid 1001) can read it only with sudo.
      - name: Secrets layout (sudo)
        run: |
          bash infra/compose/env-init.sh .
          stat -c '%n %U:%g %a' secrets secrets/jwt_signing_keys
          if test -r secrets/jwt_signing_keys; then
            echo "::error::the runner can still read secrets/jwt_signing_keys after the layout"
            exit 1
          fi
          sudo test -r secrets/jwt_signing_keys
      - name: Pull images
        run: |
          $COMPOSE pull --quiet --ignore-buildable
          # grpcurl is pinned only in check-seaweedfs.sh (GRPCURL=...); pre-pulled here so its time counts as pull.
          docker pull --quiet "$(sed -nE 's/^GRPCURL=(.*)$/\1/p' infra/compose/check-seaweedfs.sh)"
      - name: Build api image
        run: $COMPOSE build api
      - name: make up (health checks, then /v1/ready 200)
        run: make up
      - name: api reads its file secret
        run: $COMPOSE exec -T api test -r /run/secrets/jwt_signing_keys
      - name: SeaweedFS lockdown check
        run: bash infra/compose/check-seaweedfs.sh
      # The S3 read right after `make up` is the E0-14 regression test: one try, no retry. A retry
      # would hide a health check that passes before the volume server has registered.
      - name: Restart keeps Postgres, Redis and SeaweedFS data
        run: |
          psql() { $COMPOSE exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -tA -c "$1"' sh "$1"; }
          # Signed S3 call from a neighbour container (as check-seaweedfs.sh); prints "<code> <body>".
          # Keys reach it as environment variables (masked above), not command-line text.
          s3() { # put | get
            docker run --rm --network capsule_backend -e SEAWEEDFS_S3_ACCESS_KEY -e SEAWEEDFS_S3_SECRET_KEY \
              --entrypoint sh "$(docker inspect --format '{{.Config.Image}}' "$($COMPOSE ps -q seaweedfs)")" -c '
                set -- "$1" --aws-sigv4 aws:amz:us-east-1:s3 --max-time 5 -s -o /tmp/body -w "%{http_code}" \
                  --user "$SEAWEEDFS_S3_ACCESS_KEY:$SEAWEEDFS_S3_SECRET_KEY"
                op=$1; shift
                case $op in
                  put) curl "$@" -X PUT http://seaweedfs:8333/ci-smoke >/dev/null &&
                       echo kept > /tmp/o && curl "$@" -T /tmp/o http://seaweedfs:8333/ci-smoke/o ;;
                  get) curl "$@" http://seaweedfs:8333/ci-smoke/o ;;
                esac
                echo " $(head -c 300 /tmp/body | tr -d "\r\n")"' sh "$1"
          }
          # Only the two S3 keys leave .env, for `docker run -e` above.
          SEAWEEDFS_S3_ACCESS_KEY=$(sed -nE 's/^SEAWEEDFS_S3_ACCESS_KEY=(.*)$/\1/p' .env)
          SEAWEEDFS_S3_SECRET_KEY=$(sed -nE 's/^SEAWEEDFS_S3_SECRET_KEY=(.*)$/\1/p' .env)
          export SEAWEEDFS_S3_ACCESS_KEY SEAWEEDFS_S3_SECRET_KEY
          psql "CREATE TABLE ci_smoke (v text); INSERT INTO ci_smoke VALUES ('kept');"
          test "$($COMPOSE exec -T redis redis-cli SET ci:smoke kept)" = "OK"
          # Leaked-value check before `make down` removes these containers and their logs.
          bash "$RUNNER_TEMP/leak-check.sh"
          put=$(s3 put) || true # an empty result is reported below, not lost to bash -e
          if [ "${put%% *}" != "200" ]; then
            echo "::error::S3 PUT before restart: ${put:-<none>} (want 200); see docs/runbooks/compose-stack.md"
            exit 1
          fi
          make down
          make up
          got_s3=$(s3 get) || true # an empty result is reported below, not lost to bash -e
          got_pg=$(psql "SELECT v FROM ci_smoke")
          got_redis=$($COMPOSE exec -T redis redis-cli GET ci:smoke)
          echo "postgres: ${got_pg:-<none>}  redis: ${got_redis:-<none>}  s3: ${got_s3:-<none>}"
          [ "$got_s3" = "200 kept" ] || echo "::error::S3 GET right after make up: ${got_s3:-<none>} (want 200 kept); see docs/runbooks/compose-stack.md"
          test "$got_pg" = "kept" && test "$got_redis" = "kept" && test "$got_s3" = "200 kept"
      - name: No generated secret in the stack logs (after restart)
        run: bash "$RUNNER_TEMP/leak-check.sh"
      # Container state and logs only. Never `compose config` or `docker inspect` here: both print
      # the interpolated secrets. Keep the `service | ` prefix: a log line then cannot start with
      # `::` and act as a workflow command. If `--no-log-prefix` is ever used, wrap the dump in
      # `::stop-commands::<random token>` as the `changes` job does.
      - name: Dump stack logs
        if: failure() && hashFiles('.env') != ''
        run: |
          $COMPOSE ps --all
          $COMPOSE logs --no-color --timestamps --tail=200
      - name: Tear down
        if: always()
        run: |
          [ ! -f .env ] || $COMPOSE down --volumes --remove-orphans
          # secrets/ is runner-owned 0700, so its root-owned file is removed without sudo.
          rm -rf .env secrets "$RUNNER_TEMP/leak-patterns" "$RUNNER_TEMP/leak-check.sh"

  ci-ok:
    name: ci-ok
    if: always()
    # Must list every other job in this file; the first step fails the gate otherwise.
    needs: [changes, pr-title, secrets, lint, unit-api, unit-mobile, integration, audit-api, audit-mobile, stack]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/workflows/ci.yml
          sparse-checkout-cone-mode: false
      - name: Check that ci-ok needs every job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jobs=$(yq -o=json '.jobs | keys | map(select(. != "ci-ok")) | sort' .github/workflows/ci.yml | jq -c .)
          needed=$(jq -c 'keys | sort' <<< "$NEEDS")
          echo "jobs:  $jobs"
          echo "needs: $needed"
          if [ "$jobs" != "$needed" ]; then
            echo "::error::ci-ok.needs must list every job in ci.yml."
            exit 1
          fi
      - name: Check job results
        if: always()
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS" > /dev/null \
            || { echo "::error::A required job failed or was cancelled."; exit 1; }
