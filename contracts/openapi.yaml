# Capsule API contract: the single source of truth (ADR-005). Change this file first, then code.
openapi: 3.1.0
info:
  title: Capsule API
  version: 0.1.0
  description: |
    Every error is an RFC 9457 problem document (`application/problem+json`).
    Every response carries `X-Request-ID`; send one to correlate logs, or the server makes one.
security: []

tags:
  - name: ops
    description: Liveness and readiness for Compose and the uptime monitor.
  - name: auth
    description: Guest credentials and token pairs (ADR-014).

paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Liveness. The process is up; dependencies are not checked.
      tags: [ops]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The process is serving requests.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/ready:
    get:
      operationId: getReady
      summary: Readiness. Postgres and Redis each answer within the readiness probe timeout.
      tags: [ops]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Every dependency answered.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ready"
              example:
                status: ok
                checks:
                  postgres: ok
                  redis: ok
        "503":
          description: |
            At least one dependency failed or exceeded the probe timeout; `failing` names it.
            After a dependency hangs, it may stay in `failing` for up to ~10 s after it recovers,
            while the previous check finishes cleaning up its connection.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ReadyProblem"
              example:
                type: about:blank
                title: Service Unavailable
                status: 503
                detail: "Not ready: redis"
                failing: [redis]
                request_id: 3f1c2a9e0b7d4c55a1e2f3a4b5c6d7e8
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/guest:
    post:
      operationId: postAuthGuest
      summary: Create a guest, or start a new session for an existing guest.
      description: |
        Without a body, creates a guest and returns its credential with the first token pair
        (201). With `guest_credential`, returns a new token pair for that guest (200). An unknown
        credential, and one whose guest has had no activity within the guest retention, get the
        same 401. No personal data is stored.

        No idempotency key: replaying a stored response would mean storing the raw credential
        (A4). A lost 201 leaves an empty guest, which the guest purge removes.
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestSignIn"
      responses:
        "201":
          description: A new guest. Store `guest_credential` and `refresh_token` in secure storage.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestSession"
        "200":
          description: A new token pair for the existing guest.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A 10-minute access token from `/v1/auth/*` (ADR-014). Every failure gets the same
        `Unauthorized` response.

  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Client correlation id. Ignored and replaced unless it matches the pattern.
      schema:
        type: string
        pattern: "^[A-Za-z0-9-]{1,64}$"

  headers:
    RequestId:
      description: The request id used in the server logs for this request.
      schema:
        type: string
        pattern: "^[A-Za-z0-9-]{1,64}$"

    NoStore:
      description: Token responses are never cached.
      schema:
        const: no-store

  responses:
    Unauthorized:
      description: |
        Missing, malformed, expired or otherwise invalid credentials or tokens. The body is the
        same for every cause.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        WWW-Authenticate:
          schema:
            const: Bearer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            request_id: 3f1c2a9e0b7d4c55a1e2f3a4b5c6d7e8

    ValidationError:
      description: The request failed validation. Rejected values are never echoed.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ValidationProblem"

    InternalError:
      description: Unexpected server error. No internal details are returned.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Internal Server Error
            status: 500
            request_id: 3f1c2a9e0b7d4c55a1e2f3a4b5c6d7e8

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          const: ok

    Ready:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          const: ok
        checks:
          $ref: "#/components/schemas/ReadyChecks"

    ReadyChecks:
      type: object
      additionalProperties: false
      required: [postgres, redis]
      properties:
        postgres:
          const: ok
        redis:
          const: ok

    Secret:
      description: |
        An opaque guest credential or refresh token. No pattern: a malformed value gets the same
        401 as an unknown one.
      type: string
      minLength: 1
      maxLength: 256

    GuestSignIn:
      type: object
      additionalProperties: false
      required: [guest_credential]
      properties:
        guest_credential:
          $ref: "#/components/schemas/Secret"

    TokenPair:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, refresh_token]
      properties:
        access_token:
          description: "A JWT. Clients treat it as opaque and send it as `Authorization: Bearer`."
          type: string
          minLength: 1
          maxLength: 1024
        token_type:
          const: Bearer
        expires_in:
          description: Seconds until the access token expires.
          const: 600
        refresh_token:
          $ref: "#/components/schemas/Secret"

    GuestSession:
      description: The first token pair of a new guest, with the guest's credential.
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, refresh_token, guest_credential]
      properties:
        access_token:
          $ref: "#/components/schemas/TokenPair/properties/access_token"
        token_type:
          const: Bearer
        expires_in:
          const: 600
        refresh_token:
          $ref: "#/components/schemas/Secret"
        guest_credential:
          $ref: "#/components/schemas/Secret"

    Dependency:
      type: string
      enum: [postgres, redis]

    Problem:
      description: RFC 9457 problem details. Extension members are allowed.
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: Problem type URI; `about:blank` means the HTTP status says it all.
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        request_id:
          type: string
          pattern: "^[A-Za-z0-9-]{1,64}$"

    ReadyProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [failing]
          properties:
            status:
              const: 503
            failing:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                $ref: "#/components/schemas/Dependency"

    ValidationProblem:
      description: 422 for any request that fails validation. Rejected input values are never echoed.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [errors]
          properties:
            status:
              const: 422
            errors:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [loc, msg, type]
                properties:
                  loc:
                    type: array
                    items:
                      oneOf:
                        - type: string
                        - type: integer
                  msg:
                    type: string
                  type:
                    type: string
