# Capsule API contract: the single source of truth (ADR-005). Change this file first, then code.
openapi: 3.1.0
info:
  title: Capsule API
  version: 0.1.0
  description: |
    Every error is an RFC 9457 problem document (`application/problem+json`).
    Every response carries `X-Request-ID`; send one to correlate logs, or the server makes one.
security: []

tags:
  - name: ops
    description: Liveness and readiness for Compose and the uptime monitor.
  - name: auth
    description: Guest credentials and token pairs (ADR-014).

paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Liveness. The process is up; dependencies are not checked.
      tags: [ops]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The process is serving requests.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/ready:
    get:
      operationId: getReady
      summary: Readiness. Postgres and Redis each answer within the readiness probe timeout.
      tags: [ops]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Every dependency answered.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ready"
              example:
                status: ok
                checks:
                  postgres: ok
                  redis: ok
        "503":
          description: |
            At least one dependency failed or exceeded the probe timeout; `failing` names it.
            After a dependency hangs, it may stay in `failing` for up to ~10 s after it recovers,
            while the previous check finishes cleaning up its connection.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ReadyProblem"
              example:
                type: about:blank
                title: Service Unavailable
                status: 503
                detail: "Not ready: redis"
                failing: [redis]
                request_id: 3f1c2a9e0b7d4c55a1e2f3a4b5c6d7e8
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/guest:
    post:
      operationId: postAuthGuest
      summary: Create a guest, or start a new session for an existing guest.
      description: |
        Without a body, creates a guest and returns its credential with the first token pair
        (201). An empty body (`Content-Length: 0`) counts as no body; any other body, JSON `null`
        included, must be a `GuestSignIn` object or gets 422. With `guest_credential`, returns
        a new token pair for that guest (200). An unknown
        credential, and one whose guest has had no activity within the guest retention, get the
        same 401. No personal data is stored.

        No idempotency key: replaying a stored response would mean storing the raw credential
        (A4). A lost 201 leaves an empty guest, which the guest purge removes.
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestSignIn"
      responses:
        "201":
          description: A new guest. Store `guest_credential` and `refresh_token` in secure storage.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestSession"
        "200":
          description: A new token pair for the existing guest.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/refresh:
    post:
      operationId: postAuthRefresh
      summary: Swap a refresh token for a new token pair. The presented token stops working.
      description: |
        Every success rotates the refresh token: store the new `refresh_token` and drop the old
        one. A token family ends 30 days after its last refresh or 90 days after it was created.
        An unknown, malformed, expired or revoked token gets the same 401; an unknown one revokes
        nothing. A guest with no activity within the guest retention also gets that 401.

        Grace rule (ADR-014, R6): if the response to a refresh was lost, the token sent in it may
        be sent once more within 30 s of its first use, as long as the token issued for it has
        never been used. That retry gets a new pair, and the pair from the lost response stops
        working. Sending any other used token (a second retry, a retry after 30 s, or a token
        already replaced) revokes the whole family and gets 401: sign in again.

        A 503 means the family was busy; the token is still valid, so retry the same request
        after `Retry-After`. Never treat a 503 as a logout.

        No idempotency key: replaying a stored response would mean storing the raw refresh token
        (A4). The grace rule is the recovery path for a lost response.
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: A new token pair. The presented refresh token is used up.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/Busy"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/logout:
    post:
      operationId: postAuthLogout
      summary: End this device's session by revoking the family of the given refresh token.
      description: |
        Any well-formed request body gets 204, whatever the token: unknown, used, already
        revoked or not a token at all, so the answer says nothing about it. A body that fails
        the `RefreshRequest` schema gets 422. Access tokens already issued keep working until
        they expire (at most 10 minutes). Other devices stay signed in.

        A 503 means the family was busy; retry after `Retry-After`.

        No idempotency key: logout creates nothing, and repeating it returns the same 204.
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: The family is revoked, or the token matched no live family.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/Busy"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A 10-minute access token from `/v1/auth/*` (ADR-014). Every failure gets the same
        `Unauthorized` response.

  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Client correlation id. Ignored and replaced unless it matches the pattern.
      schema:
        type: string
        pattern: "^[A-Za-z0-9-]{1,64}$"

  headers:
    RequestId:
      description: The request id used in the server logs for this request.
      schema:
        type: string
        pattern: "^[A-Za-z0-9-]{1,64}$"

    NoStore:
      description: Token responses are never cached.
      schema:
        const: no-store

  responses:
    Unauthorized:
      description: |
        Missing, malformed, expired or otherwise invalid credentials or tokens. The body is the
        same for every cause.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        WWW-Authenticate:
          schema:
            const: Bearer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            request_id: 3f1c2a9e0b7d4c55a1e2f3a4b5c6d7e8

    ValidationError:
      description: The request failed validation. Rejected values are never echoed.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ValidationProblem"

    Busy:
      description: |
        The resource was locked by a concurrent request for longer than the server waits (2 s).
        Nothing changed; retry the same request after `Retry-After` seconds.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          schema:
            const: "1"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Service Unavailable
            status: 503
            request_id: 3f1c2a9e0b7d4c55a1e2f3a4b5c6d7e8

    InternalError:
      description: Unexpected server error. No internal details are returned.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Internal Server Error
            status: 500
            request_id: 3f1c2a9e0b7d4c55a1e2f3a4b5c6d7e8

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          const: ok

    Ready:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          const: ok
        checks:
          $ref: "#/components/schemas/ReadyChecks"

    ReadyChecks:
      type: object
      additionalProperties: false
      required: [postgres, redis]
      properties:
        postgres:
          const: ok
        redis:
          const: ok

    Secret:
      description: |
        An opaque guest credential or refresh token. No pattern: a malformed value gets the same
        401 as an unknown one.
      type: string
      minLength: 1
      maxLength: 256

    GuestSignIn:
      type: object
      additionalProperties: false
      required: [guest_credential]
      properties:
        guest_credential:
          $ref: "#/components/schemas/Secret"

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          $ref: "#/components/schemas/Secret"

    TokenPair:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, refresh_token]
      properties:
        access_token:
          description: "A JWT. Clients treat it as opaque and send it as `Authorization: Bearer`."
          type: string
          minLength: 1
          maxLength: 1024
        token_type:
          const: Bearer
        expires_in:
          description: Seconds until the access token expires.
          const: 600
        refresh_token:
          $ref: "#/components/schemas/Secret"

    GuestSession:
      description: The first token pair of a new guest, with the guest's credential.
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, refresh_token, guest_credential]
      properties:
        access_token:
          $ref: "#/components/schemas/TokenPair/properties/access_token"
        token_type:
          const: Bearer
        expires_in:
          const: 600
        refresh_token:
          $ref: "#/components/schemas/Secret"
        guest_credential:
          $ref: "#/components/schemas/Secret"

    Dependency:
      type: string
      enum: [postgres, redis]

    Problem:
      description: RFC 9457 problem details. Extension members are allowed.
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: Problem type URI; `about:blank` means the HTTP status says it all.
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        request_id:
          type: string
          pattern: "^[A-Za-z0-9-]{1,64}$"

    ReadyProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [failing]
          properties:
            status:
              const: 503
            failing:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                $ref: "#/components/schemas/Dependency"

    ValidationProblem:
      description: 422 for any request that fails validation. Rejected input values are never echoed.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [errors]
          properties:
            status:
              const: 422
            errors:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [loc, msg, type]
                properties:
                  loc:
                    type: array
                    items:
                      oneOf:
                        - type: string
                        - type: integer
                  msg:
                    type: string
                  type:
                    type: string
