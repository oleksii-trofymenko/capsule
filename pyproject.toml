# Repository-wide tool settings (ADR-018). Packages declare their own [project] in their folder.

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["node_modules"]

[tool.ruff.lint]
select = [
  "E", "W", "F",   # pycodestyle, pyflakes
  "I",             # isort
  "N",             # pep8-naming
  "UP",            # pyupgrade
  "B",             # bugbear
  "S",             # bandit (security)
  "ASYNC",         # blocking calls in async code
  "ANN",           # type annotations
  "C4", "SIM", "RET", "PTH",
  "TID",           # tidy-imports: module boundaries (ADR-005)
  "PGH003",        # no blanket type: ignore
  "RUF",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "ANN"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code"]
