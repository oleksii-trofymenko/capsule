# Base stack (E0-07): api, postgres + pgvector, redis, seaweedfs. Run through the Makefile
# (`make up`), which passes the repo-root .env. See README.md in this folder.
#
# Image pins: tag for humans, digest for pulls. postgres and redis MUST match the service
# containers in .github/workflows/ci.yml (ADR-016); infra/compose/check-pins.sh enforces it.
# Ports: only the api is published, and only on 127.0.0.1. Everything else stays on the
# internal `backend` network, which has no route to the host or the internet.
name: capsule

x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: "3"

services:
  api:
    build:
      context: ../../apps/api
    image: capsule-api:local
    environment:
      # Built here from the service names; the password is URL-safe hex (make up generates it).
      DATABASE_URL: postgresql://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:?set in .env}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set in .env}@redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      READY_PROBE_TIMEOUT_S: ${READY_PROBE_TIMEOUT_S:-1.0}
      DATABASE_CONNECT_TIMEOUT_S: ${DATABASE_CONNECT_TIMEOUT_S:-5}
      REDIS_SOCKET_TIMEOUT_S: ${REDIS_SOCKET_TIMEOUT_S:-5.0}
      GUEST_RETENTION_DAYS: ${GUEST_RETENTION_DAYS:-30}
    # ADR-015: file secrets at /run/secrets/<name>; api is the only consumer.
    secrets: [jwt_signing_keys]
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    networks: [backend, edge]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Health check comes from the image: /v1/health (liveness), never /v1/ready.
    # Same uid as the Dockerfile's USER; stated here so check-privileges.sh can see it.
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp:size=64m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging: *logging

  # E1-05a: one-shot `alembic upgrade head` before api starts (ADR-007). Same image and hardening
  # as api; only the database variable and only the internal network.
  # Never merge it into api with an anchor or `extends`: it would inherit api's secrets and env (ADR-015).
  migrate:
    build:
      context: ../../apps/api
    image: capsule-api:local
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:?set in .env}
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
    # The image's health check probes /v1/health, which a one-shot never serves; with it the
    # container would sit in "starting" and `up --wait` would wait on it. Disabled, `--wait`
    # treats the exited-0 container as done.
    healthcheck:
      disable: true
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp:size=64m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    logging: *logging

  postgres:
    image: pgvector/pgvector:0.8.7-pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    # ADR-022: error lines carry no DETAIL, CONTEXT or STATEMENT, so no row values reach the logs.
    # Checked with SHOW in the CI `stack` job.
    command: ["postgres", "-c", "log_error_verbosity=terse", "-c", "log_min_error_statement=panic"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [backend]
    # E0-12: runs as the image's postgres user from the start, so the entrypoint skips its
    # chown/gosu step and needs no capability. As root it would need DAC_OVERRIDE, SETUID and
    # SETGID (+ CHOWN, FOWNER for a wrongly owned volume). Tested with cap_drop ALL, one cap at a time.
    user: "999:999"
    read_only: true
    # The Unix socket dir must be writable by uid 999; /tmp for the entrypoint and initdb.
    tmpfs:
      - /var/run/postgresql:uid=999,gid=999,mode=0775,size=1m
      - /tmp:size=64m
    cap_drop: [ALL]
    healthcheck:
      # -h 127.0.0.1: the real server, not the init-time one on the Unix socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 1s
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:8.10.2-alpine@sha256:9f8d2d789b9a1d1e3f283f979aa9cbf393373806472e1ccd460e2f9c869b833b
    # ADR-006: AOF fsync every second; only keys with a TTL (cache) may be evicted.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - ${REDIS_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - volatile-lru
      - --requirepass
      - ${REDIS_PASSWORD:?set in .env}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set in .env}
    volumes:
      - redis_data:/data
    networks: [backend]
    # E0-12: runs as the image's redis user (uid 999, gid 1000); no capability needed. As root the
    # entrypoint needs SETUID and SETGID to drop to redis, and WITHOUT them it silently keeps
    # running redis-server as root, so never start it as root with a reduced cap set.
    user: "999:1000"
    read_only: true
    tmpfs: [/tmp:size=64m]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 1s
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging: *logging

  seaweedfs:
    # ADR-008: S3 API for media. Single node: master, volume, filer and S3 gateway in one process.
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command:
      - server
      - -s3
      # Master, volume and filer listen on loopback only: their HTTP APIs have no auth and would
      # bypass S3 signatures. On `backend` only two listeners remain: the S3 API on 8333 (signed
      # requests) and the S3 gRPC port 18333, whose IAM service (PutIdentity, PutPolicy, ...)
      # requires a JWT signed with the filer key from security.toml (GHSA-5fx4-c9qp-36jc).
      # Without that key any container on `backend` could create an admin identity.
      - -ip=127.0.0.1
      - -ip.bind=127.0.0.1
      - -s3.ip.bind=0.0.0.0
      # Iceberg (8181) and Lance (9101) catalog endpoints are not used; they would bind 0.0.0.0.
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      # Per-chunk encryption of S3 uploads. The keys sit in the filer store on the same disk, so
      # this is not protection against a stolen disk; that needs host disk encryption (README).
      - -s3.encryptVolumeData
      - -master.telemetry=false
      # No -v: glog verbosity stays at the default. Raising it needs the CI leak check re-run
      # (ADR-024): SigV4 failure logging grows with verbosity and may print the S3 access key ID
      # in lines the filter does not drop. At the default, a wrong-secret request logs no ID
      # (checked on 4.48; check-seaweedfs.sh sends one before the leak check runs).
    environment:
      # The one S3 identity (admin), read on every start. Without any identity SeaweedFS S3 would
      # accept anonymous requests.
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_S3_ACCESS_KEY:?set in .env}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_S3_SECRET_KEY:?set in .env}
    configs:
      - source: seaweedfs_security
        target: /etc/seaweedfs/security.toml
    volumes:
      - seaweed_data:/data
    networks: [backend]
    # E0-12: runs as the image's seaweed user (uid 1000) from the start; no capability needed (all
    # ports are above 1024). As root the entrypoint chowns /data and drops to uid 1000 with
    # su-exec, which needs SETUID and SETGID. The image's /data is owned by 1000, so new volumes
    # are too; a volume owned by someone else: see docs/runbooks/compose-stack.md.
    # Root filesystem stays writable: Compose cannot place `configs.content` (security.toml) into a
    # read-only container, and moving the JWT keys elsewhere is secrets work (ADR-015).
    user: "1000:1000"
    # weed puts its Unix sockets in /tmp.
    tmpfs: [/tmp:size=64m]
    cap_drop: [ALL]
    healthcheck:
      # E0-14: S3 /healthz alone passes before the volume server has registered with the master;
      # reads then fail with 500 ("volume not found") for 1-2 s. So the check also needs a data node
      # in the master's /dir/status ("PublicUrl" exists only inside DataNodes entries). The volume
      # server's own /healthz (8080) is no signal: it passes ~15 s before registration. Both shapes
      # checked on 4.48; recheck them after a bump (a changed shape fails closed: unhealthy).
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null http://127.0.0.1:8333/healthz &&
          wget -q -O - http://127.0.0.1:9333/dir/status | grep -q '"PublicUrl"'
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 1s
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging: *logging

configs:
  # JWT keys, generated into .env by `make up`. jwt.filer_signing is the one that closes the IAM
  # gRPC service on 18333 (tested on 4.48); jwt.signing also signs volume-server writes.
  seaweedfs_security:
    content: |
      [jwt.signing]
      key = "${SEAWEEDFS_JWT_SIGNING_KEY:?set in .env}"

      [jwt.filer_signing]
      key = "${SEAWEEDFS_JWT_FILER_SIGNING_KEY:?set in .env}"

# ADR-015: application secrets, one file each in the gitignored repo-root secrets/, created by
# env-init.sh (`make up`). Outside Swarm Compose bind-mounts them and ignores uid/gid/mode; the host
# file's owner and mode (set by env-init.sh) are what the container sees. Cloud: change `file:` only.
secrets:
  jwt_signing_keys:
    file: ../../secrets/jwt_signing_keys

networks:
  backend:
    internal: true
  edge: {}

volumes:
  pg_data:
  redis_data:
  seaweed_data:
    # Media are deleted within 24 h and never backed up (ADR-008).
    labels:
      capsule.backup: never
